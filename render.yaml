services:
  # ── API Server (Node.js Web Service) ──────────────────────────────────────
  - type: web
    name: xauusd-terminal-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: >
      npx --yes pnpm@10.26.1 install --frozen-lockfile &&
      npx --yes pnpm@10.26.1 --filter @workspace/api-server run build
    startCommand: >
      npx --yes pnpm@10.26.1 --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false
        value: 10000
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false          # NewsAPI.org key for /api/xauusd/news — falls back to static feed if unset
      - key: FF_CALENDAR_GITHUB_OWNER
        sync: false          # your GitHub username (where you forked forex_factory_calendar_news_scraper)
      - key: FF_CALENDAR_GITHUB_REPO
        sync: false          # defaults to forex_factory_calendar_news_scraper
      - key: FF_CALENDAR_GITHUB_BRANCH
        sync: false          # defaults to main
      - key: SESSION_SECRET
        sync: false          # REQUIRED — derives the chat message encryption key. Server refuses to start in production without this set. Generate e.g. `openssl rand -hex 32`.
      - key: ALLOWED_ORIGINS
        sync: false          # REQUIRED in production — comma-separated list of frontend origins allowed for CORS, e.g. https://xauusd-terminal-journal.onrender.com,https://xauusd-terminal-admin.onrender.com
      - key: ADMIN_TELEGRAM_BOT_TOKEN
        sync: false          # Optional — your own Telegram bot token, used to alert you when the Terminal Assistant detects repeated backend/secret probing
      - key: ADMIN_TELEGRAM_CHAT_ID
        sync: false          # Optional — your Telegram chat id to receive the above alerts

  # ── Trading Journal Frontend (Static Site) ────────────────────────────────
  - type: web
    name: xauusd-terminal-journal
    runtime: static
    region: singapore
    plan: free
    buildCommand: >
      npx --yes pnpm@10.26.1 install --frozen-lockfile &&
      PORT=3000 BASE_PATH=/ npx --yes pnpm@10.26.1 --filter @workspace/trading-journal run build
    staticPublishPath: artifacts/trading-journal/dist/public
    envVars:
      - key: VITE_API_URL
        sync: false          # set to your API server URL, e.g. https://xauusd-terminal-api-uq6u.onrender.com
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Admin Panel Frontend (Static Site) ─────────────────────────────────────
  - type: web
    name: xauusd-terminal-admin
    runtime: static
    region: singapore
    plan: free
    buildCommand: >
      npx --yes pnpm@10.26.1 install --frozen-lockfile &&
      PORT=3000 BASE_PATH=/ npx --yes pnpm@10.26.1 --filter @workspace/admin-panel run build
    staticPublishPath: artifacts/admin-panel/dist/public
    envVars:
      - key: VITE_API_URL
        sync: false          # same API server URL as the journal frontend
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Remember to add this service's URL to the API's ALLOWED_ORIGINS env var,
    # and to ADMIN_EMAILS for whichever account(s) should have admin access.
